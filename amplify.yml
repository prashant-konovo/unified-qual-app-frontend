version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npm run lint || echo "Lint warnings found (non-blocking)"
        - npm test
        # Snyk security scanning (non-blocking — remove '|| true' to enforce)
        - npm install -g snyk
        - snyk test --severity-threshold=high || true
        - snyk code test || true
        - snyk monitor || true
    build:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
